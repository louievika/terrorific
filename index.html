<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ART // LOGIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="description" content="ART // LOGIN - a horror game for mobile.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23c4161d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/ui/title.css">
</head>
<body>

<!-- audio-unlock gate (first tap: AudioContext resume + silent buffer, iOS-safe) -->
<div id="gate">
  <div class="dot"></div>
</div>

<div id="stage">
  <div id="frame">
    <div id="face">
      <img id="artA" class="artimg" alt="" draggable="false">
      <img id="artB" class="artimg" alt="" draggable="false">
    </div>
    <div id="warm"></div>
    <div id="dark"></div>
    <div id="vig"></div>
    <div id="flash"></div>
  </div>

  <div id="grain"></div>

  <!-- swinging bulb -->
  <div id="bulbWrap"><div id="bulb" class="bulb"><div class="cord"></div><div class="socket"></div><div class="glass"></div><div class="halo"></div></div></div>

  <button id="enter" type="button" aria-label="Enter"><span>ENTER</span></button>
</div>


<script src="assets/ui/title.js"></script>
</body>
</html>
